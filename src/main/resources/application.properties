spring.application.name=ms-credits

# Datasource - la base de datos y su esquema son creados por sql/create-datatable.sql
spring.datasource.url=jdbc:mysql://localhost:3306/prestamo_mvp?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA - el esquema es propiedad de create-datatable.sql, Hibernate solo valida contra el
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:change-this-secret-in-production-please-0123456789abcdef}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
